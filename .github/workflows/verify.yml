name: Reconstruction prototype checks
on:
  push:
    branches: [reconstruction-prototype]
  pull_request:
    branches: [reconstruction-prototype]
concurrency:
  group: reconstruction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium with graphics libraries
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax and deterministic rules
        run: npm run check
      - name: Visual scene render/resource checks
        run: npm run test:visual
      - name: Screenshot reference visual and HUD test
        run: npm run test:reference
      - name: Normal-rules campaign test (no gameplay overrides)
        run: npm run test:campaign
      - name: WebGL opening-route smoke test
        run: npm run test:browser
      - name: Keyboard-controlled opening-route test
        run: npm run test:route
      - name: Mobile viewport and touch-control test
        run: npm run test:mobile
      - name: Combat input and infected attack integration test
        run: npm run test:combat
      - name: Attach browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashford-browser-qa
          path: artifacts/*.png
          if-no-files-found: ignore
