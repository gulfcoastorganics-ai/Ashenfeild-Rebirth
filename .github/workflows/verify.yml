name: Reconstruction prototype checks
on:
  push:
    branches: [reconstruction-prototype, reconstruction-v0.2-audit]
  pull_request:
    branches: [reconstruction-prototype]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and run deterministic logic tests
        run: npm run check
